<div class="code_name">乱数(0～max)</div>

<pre><code>//0 ～ max-1までの乱数(整数)を返す関数
function getRandomInt(max) {
return Math.floor(Math.random() * max);
}
</code></pre>

<div class="code_name">乱数(1～max)</div>

<pre><code>//1 ～ maxまでの乱数(整数)を返す関数
function getRandomInt(max) {
return Math.floor(Math.random() * max) + 1;
}
</code></pre>
